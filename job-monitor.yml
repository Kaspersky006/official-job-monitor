name: Official Job Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-job-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check official careers pages and send email
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL: akashckb29@gmail.com
          REPORT_EXISTING_ON_FIRST_RUN: "true"
        run: python src/monitor.py

      - name: Save deduplication state
        run: |
          if git diff --quiet -- data/seen_jobs.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "official-job-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          git commit -m "chore: update seen job state"
          git push
